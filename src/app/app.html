<div class="app-shell" data-testid="app-shell">
  <header class="app-shell__header">
    <div class="brand">
      <a href="https://ponderingsilver.com/resume/" target="_blank" rel="noopener noreferrer" class="brand__mark">PS</a>
      <a routerLink="/chat" class="brand__copy">
        <strong>Conversations Woven</strong>
        <small>Context-first workspace</small>
      </a>
    </div>

    <nav class="primary-nav" aria-label="Primary">
      <a routerLink="/chat" routerLinkActive="active">Chat</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>

    <button
      type="button"
      class="nav-action"
      [class.nav-action--locked]="!isUnlocked()"
      [class.nav-action--unlocked]="isUnlocked()"
      [title]="isUnlocked() ? 'Keychain unlocked' : 'Keychain locked - Click to unlock'"
      (click)="handleKeychainAction()"
    >
      {{ isUnlocked() ? '🔓' : '🔒' }}
    </button>
  </header>

  <main class="app-shell__content">
    <router-outlet />
  </main>
  
  <app-loading-overlay />
</div>
