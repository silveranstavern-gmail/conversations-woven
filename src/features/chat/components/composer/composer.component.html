<div class="composer-shell" [class.disabled]="disabled()">

  @if (showToolbar()) {
    <div class="composer-toolbar">
      <app-model-selector
        class="composer-toolbar__model"
        [compact]="true"
        [selectedModelId]="modelId()"
        [disabled]="disabled()"
        (modelSelected)="handleModelSelected($event)"
      />

      @if (showContextIndicator()) {
        <app-context-indicator
          class="composer-toolbar__context"
          [usage]="contextUsage()"
          [limit]="contextLimit()"
          [pending]="contextPending()"
        />
      }

      @if (contextModeDetail()) {
        <button
          type="button"
          class="composer-toolbar__context-mode"
          appButton
          variant="ghost"
          size="sm"
          [class.active]="isContextSelectionActive()"
          [title]="contextModeDetail() ?? contextModeLabel()"
          (click)="handleContextModeToggle()"
        >
          <span class="composer-toolbar__mode-dot" aria-hidden="true"></span>
          <span>{{ contextModeLabel() }}</span>
        </button>
      }
    </div>
  }

  <textarea
    #textarea
    class="composer-input"
    [placeholder]="placeholderText()"
    [value]="draft()"
    [disabled]="disabled()"
    (input)="onDraftInput($event)"
    (keydown)="onKeydown($event)"
    rows="1"
  ></textarea>

  <div class="composer-footer">
    <div class="composer-actions">
      <span
        appTooltip
        [requiresUnlock]="true"
        [disabled]="isSendDisabled()"
        [message]="sendTooltipMessage()"
        position="top"
        align="center"
        size="sm"
      >
        <button
          class="send-btn"
          type="button"
          [disabled]="isSendDisabled()"
          (click)="onSubmit()"
          aria-label="Send Message"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </span>
    </div>
  </div>
</div>
