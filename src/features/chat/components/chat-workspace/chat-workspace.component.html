<section class="workspace">
  
  @if (thread(); as current) {
    <app-chat-header 
      [thread]="current" 
      [subtitle]="headerSubtitle()"
      [messageCount]="messages().length"
      (titleClicked)="handleTitleClick()"
      (exportClicked)="handleExportThread()"
    />

    <!-- Message Stream -->
    <div class="workspace__body" #scrollContainer>
      <div class="workspace__stream-container">
        
        <!-- Selection Toolbar (Conditional) -->
        @if (hasSelection()) {
          <div class="workspace__selection surface-card">
            <p class="workspace__selection-label">
              {{ selectionCount() }} message{{ selectionCount() === 1 ? '' : 's' }} selected
            </p>
            <div class="workspace__selection-actions">
              <button type="button" appButton variant="ghost" size="sm" (click)="handleSelectAll()">
                Select all
              </button>
              <button
                type="button"
                appButton
                variant="ghost"
                size="sm"
                (click)="handleCopySelection()"
              >
                Copy
              </button>
              <span 
                appTooltip 
                [requiresUnlock]="true"
                [disabled]="!canCompactSelection()" 
                [hasSelection]="selectionCount() >= 2" 
                message="Select at least 2 messages to compact" 
                position="top" 
                align="center" 
                size="sm"
              >
                <button
                  type="button"
                  appButton
                  variant="ghost"
                  size="sm"
                  (click)="handleCompactSelection()"
                  [disabled]="!canCompactSelection() || !isUnlocked() || storedProviders().length === 0"
                >
                  Compact
                </button>
              </span>
              <button
                type="button"
                appButton
                variant="danger"
                size="sm"
                (click)="handleDeleteSelected()"
              >
                Delete
              </button>
              <button type="button" appButton variant="ghost" size="sm" (click)="handleClearSelection()">
                Clear
              </button>
            </div>
          </div>
        }

        <app-message-list
          [messages]="messages()"
          [activeMessageId]="activeMessageId()"
          [selectedIds]="selectedMessageIds()"
          [isContextSelectionActive]="isContextSelectionActive()"
          [contextSelectedIds]="currentThreadContextSet()"
          (deleteMessage)="handleDeleteMessage($event)"
          (branchFrom)="handleBranchMessage($event)"
          (copyMessage)="handleCopyMessage($event)"
          (selectionChange)="handleSelectionChange($event)"
          (restoreCompaction)="handleRestoreCompaction($event)"
          (updateMessage)="handleUpdateMessage($event)"
          (contextSelectionChange)="handleContextSelectionChange($event)"
        />
      </div>
    </div>

    <!-- Composer -->
    <div class="workspace__composer-dock">
      <div class="workspace__composer-wrapper">
        <app-composer
          [disabled]="composerDisabled()"
          [modelId]="preferredModelId()"
          (submitMessage)="handleComposerSubmit($event)"
        />
      </div>
    </div>

  } @else {
    <!-- Hero / Empty State -->
    <div class="workspace__empty-state">
      <div class="workspace__empty-brand">
        <div class="workspace__logo">🧶</div>
        <h2 class="workspace__empty-title">How can I help you?</h2>
      </div>
      
      <!-- Centered Composer -->
      <div class="workspace__composer-wrapper" style="max-width: 650px; width: 90%;">
        <app-composer
          [disabled]="false"
          [modelId]="preferredModelId()"
          (submitMessage)="handleComposerSubmit($event)"
        />
      </div>
    </div>
  }
</section>
