<app-dialog-shell [title]="title" message="Configure system prompt and temperature for this thread" width="500px" (cancel)="handleCancel()">
  <div class="dialog-body-content">
      <div class="dialog-field">
        <label class="dialog-label" for="system-prompt">
          System Prompt
          <span class="dialog-label-hint">Optional instructions that guide the AI's behavior</span>
        </label>
        <textarea
          id="system-prompt"
          class="dialog-textarea"
          [value]="systemPrompt()"
          (input)="handleSystemPromptChange($event)"
          (keydown)="handleKeydown($event)"
          placeholder="You are a helpful assistant..."
          rows="4"
        ></textarea>
      </div>

      <div class="dialog-field">
        <label class="dialog-label" for="temperature">
          Temperature
          <span class="dialog-label-hint">Controls randomness (0.0 = deterministic, 2.0 = creative)</span>
        </label>
        <div class="dialog-slider-container">
          <input
            id="temperature"
            type="range"
            class="dialog-slider"
            min="0"
            max="2"
            step="0.1"
            [value]="temperature() ?? 1"
            (input)="handleTemperatureChange($event)"
          />
          <span class="dialog-slider-value">{{ (temperature() ?? 1).toFixed(1) }}</span>
        </div>
      </div>
  </div>
  <div class="dialog-footer-content">
    <button type="button" appButton variant="secondary" (click)="handleCancel()">
      Cancel
    </button>
    <button type="button" appButton variant="primary" (click)="handleConfirm()">
      Save
    </button>
  </div>
</app-dialog-shell>
