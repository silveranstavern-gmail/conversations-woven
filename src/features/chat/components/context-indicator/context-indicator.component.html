<div 
  class="context-indicator" 
  [class.context-indicator--warning]="isWarning()"
  [class.context-indicator--error]="isError()"
  [title]="tooltip()"
>
  <div class="context-bar" role="progressbar" [attr.aria-valuenow]="percentage()" aria-valuemin="0" aria-valuemax="100">
    <div class="context-bar__fill" [style.width.%]="percentage()"></div>
  </div>
  <span>{{ usage() | number }} / {{ limit() | number }} tokens</span>
</div>
