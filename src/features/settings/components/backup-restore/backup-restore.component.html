<app-settings-section
  eyebrow="Data safety"
  heading="Backup & restore"
  description="Export bundles omit raw provider keys and respect local encryption policies."
>
  <div class="settings-section__actions-content">
    <input
      #fileInput
      type="file"
      class="visually-hidden"
      accept="application/json"
      (change)="handleImportSelected($event)"
    />
    <button type="button" appButton variant="ghost" (click)="handleExport()" [disabled]="isProcessing()">
      Export bundle
    </button>
    <button
      type="button"
      appButton
      variant="ghost"
      (click)="triggerImport(fileInput)"
      [disabled]="isProcessing()"
    >
      Import bundle
    </button>
  </div>
  <div class="settings-section__body-content">
    @if (statusMessage()) {
      <p class="text-muted small">{{ statusMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <section class="backup-cards">
  @for (step of steps; track step.title) {
    <article class="surface-card backup-card">
      <h3>{{ step.title }}</h3>
      <p>{{ step.detail }}</p>
    </article>
    }
    </section>
  </div>
</app-settings-section>
