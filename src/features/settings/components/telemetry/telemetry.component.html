<header class="settings-section__header">
  <div>
    <p class="settings-section__eyebrow">Privacy</p>
    <h2>Telemetry</h2>
    <p class="text-muted">
      Anonymous metrics help track performance budgets only when you explicitly opt in.
    </p>
  </div>
  <button type="button" class="ghost-button" (click)="toggleTelemetry()">
    {{ telemetryEnabled() ? 'Disable' : 'Enable' }} telemetry
  </button>
</header>

<section class="telemetry-card surface-card" aria-live="polite">
  <h3>{{ statusLabel() }}</h3>
  <p>
    Collected metrics: first-render time, stream chunk latency, and average messages per thread. No
    message content or API keys leave the client.
  </p>
</section>
