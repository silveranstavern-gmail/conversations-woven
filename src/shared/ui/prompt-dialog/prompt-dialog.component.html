<app-dialog-shell [title]="title()" [message]="message()" (cancel)="handleCancel()">
  <div class="dialog-body-content">
    <input
      #inputRef
      [type]="inputType()"
      class="dialog-input"
      [value]="inputValue()"
      [placeholder]="placeholder()"
      (input)="inputValue.set($any($event.target).value)"
      (keydown)="handleKeydown($event)"
    />
  </div>
  <div class="dialog-footer-content">
    <button type="button" appButton variant="secondary" (click)="handleCancel()">
      {{ cancelLabel() }}
    </button>
    <button type="button" appButton variant="primary" (click)="handleConfirm()">
      {{ confirmLabel() }}
    </button>
  </div>
</app-dialog-shell>
