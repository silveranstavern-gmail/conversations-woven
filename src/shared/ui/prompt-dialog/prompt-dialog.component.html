<app-dialog-shell [title]="title" [message]="message" (cancel)="handleCancel()">
  <div class="dialog-body-content">
    <input
      [type]="inputType"
      class="dialog-input"
      [value]="inputValue()"
      [placeholder]="placeholder"
      (input)="inputValue.set($any($event.target).value)"
      (keydown)="handleKeydown($event)"
      autofocus
    />
  </div>
  <div class="dialog-footer-content">
    <button type="button" class="dialog-button dialog-button--secondary" (click)="handleCancel()">
      {{ cancelLabel }}
    </button>
    <button type="button" class="dialog-button dialog-button--primary" (click)="handleConfirm()">
      {{ confirmLabel }}
    </button>
  </div>
</app-dialog-shell>
